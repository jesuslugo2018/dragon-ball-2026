<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon ball z</title>
    <script src="practice-js.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/31862d6554.js" crossorigin="anonymous"></script>

</head>
<body>
    <h1 class="text-title">Dragon ball personajes</h1>
    <div class="search-container">
        
        <input type="text" id="input-search" placeholder="Search characters ...." oninput="filterCharacter()">
        <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    
    <div class="card-main-container">
       <div class="container-dragon" id="dragon-ball-container"></div>
    </div>
    <div id="main-modal" class="modal">
        <div id="modal-content">
            <button class="close" id="close-modal"><i class="fa-solid fa-xmark"></i></button>
            <p id="description-character">Some Text here</p> 
        </div>
    </div>
    <br>
</body>
</html>
